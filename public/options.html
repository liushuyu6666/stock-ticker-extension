<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Stock Ticker — Watchlist</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 32px;
        background: #f6f4f1;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        color: #1f2328;
      }
      .panel {
        max-width: 520px;
        margin: 0 auto;
        background: #fff;
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 10px;
        padding: 24px;
      }
      h1 { margin: 0 0 4px; font-size: 17px; }
      p.lede { margin: 0 0 20px; font-size: 13px; color: #5f6368; line-height: 1.5; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th {
        text-align: left;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #9aa0a6;
        font-weight: 600;
        padding-bottom: 8px;
      }
      td { padding: 5px 0; border-top: 1px solid rgba(0, 0, 0, 0.05); }
      td.symbol { font-weight: 700; letter-spacing: 0.03em; }
      input[type='number'], input[type='text'] {
        width: 110px;
        height: 30px;
        padding: 0 9px;
        font: inherit;
        font-size: 13px;
        border: 1px solid rgba(0, 0, 0, 0.14);
        border-radius: 6px;
        background: #fff;
        outline: none;
      }
      input:focus { border-color: #1f2328; }
      button {
        height: 30px;
        padding: 0 13px;
        font: inherit;
        font-size: 12px;
        border-radius: 6px;
        border: 1px solid rgba(0, 0, 0, 0.14);
        background: #fff;
        cursor: pointer;
      }
      button:hover { background: #f6f4f1; }
      button.primary { background: #1f2328; border-color: #1f2328; color: #fff; }
      button.primary:hover { background: #000; }
      button.remove { color: #d93025; border-color: rgba(217, 48, 37, 0.3); }
      #add-form { display: flex; gap: 8px; margin: 18px 0 4px; }
      .actions { display: flex; align-items: center; gap: 12px; margin-top: 20px; }
      .status { font-size: 12px; color: #5f6368; }
      .status.is-error { color: #d93025; }
      td:last-child { text-align: right; }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>Watchlist</h1>
      <p class="lede">
        The sparkline turns <strong>red</strong> when the current price is above your target and
        <strong>green</strong> when it is at or below it.
      </p>
      <table>
        <thead>
          <tr><th>Symbol</th><th>Target</th><th></th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <form id="add-form">
        <input id="new-symbol" type="text" placeholder="Symbol" aria-label="Symbol" maxlength="12" />
        <input id="new-target" type="number" step="0.01" min="0" placeholder="Target" aria-label="Target price" />
        <button type="submit">Add</button>
      </form>
      <div class="actions">
        <button type="button" id="save" class="primary">Save</button>
        <span id="status" class="status"></span>
      </div>
    </div>
    <script src="options.js"></script>
  </body>
</html>
